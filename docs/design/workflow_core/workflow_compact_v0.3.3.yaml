task_directory_policy:
  canonical_active_root: audit/tasks/active/<task_domain>/<short_task>/
  canonical_closed_root: audit/tasks/closed/<task_domain>/<short_task>/
  canonical_archive_root: audit/tasks/archive/<milestone_id>/<task_domain>/<short_task>/
  legacy_roots:
  - audit/hermes_tasks/<task_id>/
  - audit/pm_runtime_tasks/<task_id>/
  - audit/tasks/active/<task_id>/
  - audit/tasks/closed/<task_id>/
  - audit/tasks/archive/<milestone_id>/<task_id>/
  legacy_roots_are_canonical: false
  layouts:
    s_level:
      required:
      - task/dispatch.md
      - task/approval.yaml
      - runtime/result.yaml
      - summary/pm_runtime_summary.md
      optional:
      - ds/ds_receipt.yaml
    m_level:
      required:
      - task/dispatch.md
      - task/approval.yaml
      - runtime/progress.yaml
      - runtime/result.yaml
      - summary/pm_runtime_summary.md
      optional:
      - codex/codex_receipt.yaml
      - codex/codex_handoff.md
      - ds/ds_receipt.yaml
      - ds/ds_post_execution_review.md
    l_level:
      required:
      - task/dispatch.md
      - task/approval.yaml
      - runtime/heartbeat.json
      - runtime/progress.yaml
      - runtime/result.yaml
      - summary/pm_runtime_summary.md
      optional:
      - codex/codex_receipt.yaml
      - codex/codex_handoff.md
      - codex/codex_attempt_report.md
      - ds/ds_pre_audit.md
      - ds/ds_post_execution_review.md
      - ds/ds_receipt.yaml
      - logs/runtime.log
  policy_status: bootstrap_workspace_alignment
  bootstrap_workspace: true
  final_production_task_registry_path: pending_task_management_model_design
  policy_notes:
  - Current audit/tasks layout is a bootstrap workspace convention, not final production task registry.
  - Two-level <task_domain>/<short_task> layout is used to align PM Runtime bootstrap tasks and avoid false validation blockers.
  - Final task/document management model remains pending after Communication Substrate MVP task testing.
  communication_substrate_v0_1_layout:
    required:
    - dispatch/task_config.yaml
    - dispatch/dispatch.md
    - runtime/pre_action_check.yaml
    - runtime/registry_events.jsonl
    - runtime/task_state.yaml
    - logs/stdout.log
    - logs/stderr.log
    - summary/pm_runtime_summary.md
    optional:
    - runtime/heartbeat.json
    - runtime/progress.yaml
    - runtime/blocker_report.md
    - runtime/owner_decision_request.yaml
    - runtime/owner_decision_record.yaml
    - runtime/recovery_summary.md
    - logs/raw_output.jsonl
    - logs/stdout.partial.log
    - logs/stderr.partial.log
    - ds/
    - codex/
    - sandbox/
    - artifacts/
    non_final_note: This layout is for PM Runtime Communication Substrate bootstrap tasks only.
pm_runtime_state_model:
  required_state_concepts:
  - heartbeat
  - progress
  - result
  heartbeat:
    purpose: task_alive_check
    persisted_for:
    - l_level
    - long_running_tasks
    - end_to_end_execution_packages
    preferred_format: json
  progress:
    purpose: current_stage_check
    persisted_for:
    - m_level_when_external_loop_exists
    - l_level
    - long_running_tasks
    preferred_format: yaml
  result:
    purpose: final_execution_status
    persisted_for:
    - all_pm_runtime_tasks
    preferred_format: yaml
  machine_rule:
    status_source_priority:
    - runtime/result.yaml
    - required_artifact_existence
    - receipt_status
    - pm_runtime_summary
    ai_summary_alone_can_mark_success: false
  status_model: two_level_task_status_plus_runtime_state
  task_status_enum_ref: enums.task_status
  runtime_state_enum_ref: enums.runtime_state
  runtime_contract_alignment: pm_runtime_communication_substrate_runtime_contract_v0.1
  bootstrap_alignment_notes:
  - task_status is workflow lifecycle.
  - runtime_state is operational detail.
  - runtime_state values include sandbox_denied, suspected_blocked, rerun_required, partial_output, recovered, and other substrate
    states.
dispatch_contract:
  object_name: dispatch
  required_fields:
    task_id:
      type: string
      required: true
    task_title:
      type: string
      required: true
    task_date:
      type: date_or_string
      required: true
    task_type:
      type: string
      required: true
    owner:
      type: string
      required: true
    executor:
      type: enum
      enum_ref: executor_type
      required: true
    status:
      type: enum
      enum_ref: task_status
      required: true
    created_at:
      type: datetime_or_string
      required: true
    goal:
      type: string
      required: true
    scope:
      type: string_or_object
      required: true
    allowed_actions:
      type: list_string
      required: true
    forbidden_actions:
      type: list_string
      required: true
    allowed_read_paths:
      type: list_path
      required: true
    allowed_write_paths:
      type: list_path
      required: true
    expected_outputs:
      type: list_path_or_object
      required: true
    acceptance_criteria:
      type: list_string
      required: true
    failure_policy:
      type: string_or_object
      required: true
  extra_fields_by_executor:
    ds_team:
      team_mode_required:
        type: boolean
        required: true
      mcp_required:
        type: boolean
        required: true
      report_required:
        type: boolean
        required: true
      receipt_required:
        type: boolean
        required: true
    codex:
      allowed_files:
        type: list_path
        required: true
      forbidden_files:
        type: list_path
        required: true
      required_commands:
        type: list_string
        required: true
      diff_report_required:
        type: boolean
        required: true
    pm_runtime:
      runtime_allowed_level:
        type: enum
        allowed_values:
        - L0
        - L1
        - L2
        - L3
        required: true
      heartbeat_required:
        type: boolean
        required: true
      progress_required:
        type: boolean
        required: true
      result_required:
        type: boolean
        required: true
      receipt_required:
        type: boolean
        required: true
  validation_rules:
  - id: dispatch_status_must_be_task_status_enum
    severity: blocker
    check: status in enums.task_status
  - id: failure_policy_required
    severity: blocker
    check: failure_policy exists
  - id: no_execution_without_approved_status
    severity: blocker
    check: task cannot run unless status == approved
  status_values:
    enum_ref: task_status
    values: *id001
    machine_note: Local alias for machine readers; authoritative enum remains enums.task_status.
receipt_contract:
  object_name: receipt
  required_fields:
    task_id:
      type: string
      required: true
    task_title:
      type: string
      required: true
    executor:
      type: enum
      enum_ref: executor_type
      required: true
    started_at:
      type: datetime_or_string
      required: true
    completed_at:
      type: datetime_or_string
      required: true
    elapsed_sec:
      type: number
      required: true
    status:
      type: enum
      allowed_values:
      - completed
      - failed
      - hold
      required: true
    verdict:
      type: enum
      enum_ref: acceptance_verdict
      required: true
    team_mode_used:
      type: boolean_or_na
      required: true
    mcp_used:
      type: boolean_or_na
      required: true
    input_files:
      type: list_path
      required: true
    output_files:
      type: list_path
      required: true
    modified_files:
      type: list_path
      required: true
    commands_run:
      type: list_string_or_object
      required: true
    known_issues:
      type: list_string
      required: true
    blockers:
      type: list_string
      required: true
    next_recommendation:
      type: string
      required: true
  validation_rules:
  - id: receipt_must_include_output_paths
    severity: blocker
    check: output_files length > 0 for report_required tasks
    on_fail: status cannot be completed
  - id: team_mode_required_but_not_used
    severity: major
    check: if dispatch.team_mode_required == true then receipt.team_mode_used == true
    on_fail: verdict must be process_issue_or_partial_audit_or_hold
  - id: mcp_required_but_not_used
    severity: major
    check: if dispatch.mcp_required == true then receipt.mcp_used == true
    on_fail: reason_required
  - id: plain_done_not_valid
    severity: blocker
    check: receipt has structured required fields
  validation_schema:
    required:
    - task_id
    - task_title
    - executor
    - started_at
    - completed_at
    - elapsed_sec
    - status
    - verdict
    - team_mode_used
    - mcp_used
    - input_files
    - output_files
    - modified_files
    - commands_run
    - known_issues
    - blockers
    - next_recommendation
    optional:
    - report_path
    - receipt_path
    - summary_path
    - run_dir
    - diff_summary
    - process_issues
    - recommended_commit_message
    field_rules:
      task_id:
        type: string
        required: true
        min_length: 1
      task_title:
        type: string
        required: true
        min_length: 1
      executor:
        type: enum
        enum_ref: executor_type
        required: true
      status:
        type: enum
        required: true
        allowed_values:
        - completed
        - failed
        - hold
      verdict:
        type: enum
        enum_ref: acceptance_verdict
        required: true
      elapsed_sec:
        type: number
        required: true
        min_value: 0
      team_mode_used:
        type: boolean_or_na
        required: true
        allowed_values:
        - true
        - false
        - N/A
      mcp_used:
        type: boolean_or_na
        required: true
        allowed_values:
        - true
        - false
        - N/A
      input_files:
        type: list_path
        required: true
      output_files:
        type: list_path
        required: true
        min_items_if_report_required: 1
      modified_files:
        type: list_path
        required: true
        allow_empty: true
      commands_run:
        type: list_string_or_object
        required: true
        allow_empty: true
      known_issues:
        type: list_string
        required: true
        allow_empty: true
      blockers:
        type: list_string
        required: true
        allow_empty: true
      next_recommendation:
        type: string
        required: true
        min_length: 1
    cross_field_rules:
    - id: completed_receipt_requires_output_files
      severity: blocker
      if: status == completed and report_required == true
      then: len(output_files) >= 1
    - id: failed_receipt_requires_blocker_or_known_issue
      severity: major
      if: status == failed
      then: len(blockers) >= 1 or len(known_issues) >= 1
    - id: hold_receipt_requires_next_recommendation
      severity: blocker
      if: status == hold
      then: next_recommendation is not empty
    - id: team_mode_required_consistency
      severity: major
      if: dispatch.team_mode_required == true
      then: team_mode_used == true or verdict in [hold, repairable_hold, blocking_hold]
    - id: mcp_required_consistency
      severity: major
      if: dispatch.mcp_required == true
      then: mcp_used == true or verdict in [hold, repairable_hold, blocking_hold]
ds_review_contract:
  pre_audit_name: DS Pre-Audit
  post_execution_name: DS Post-Execution Review
  deprecated_separate_nodes:
  - DS Verify
  - DS Accept
  post_execution_contains:
  - verify_checks
  - acceptance_verdict
  five_phase_verify_flow:
  - phase: intake
    required_checks:
    - dispatch_exists
    - scope_understood
    - required_files_available
  - phase: scope_compliance
    required_checks:
    - allowed_files_checked
    - forbidden_files_checked
    - no_scope_expansion
  - phase: artifact_and_command_verification
    required_checks:
    - required_outputs_exist
    - commands_run_reviewed
    - test_or_smoke_evidence_reviewed
  - phase: risk_and_process_review
    required_checks:
    - blockers_identified
    - known_issues_identified
    - process_issues_identified
    - design_smell_checked_if_relevant
  - phase: verdict
    required_checks:
    - acceptance_verdict_set
    - report_path_present
    - receipt_path_present
    - next_recommendation_present
  required_receipt_flags:
  - team_mode_used
  - mcp_used
  validation_rules:
  - id: ds_team_mode_flag_required
    severity: blocker
    check: team_mode_used in [true, false]
  - id: ds_mcp_flag_required
    severity: blocker
    check: mcp_used in [true, false]
  - id: ds_verdict_must_be_enum
    severity: blocker
    check: acceptance_verdict in enums.acceptance_verdict
codex_execution_contract:
  entry_condition: approved_dispatch
  required_gates:
  - codex_safety_gate
  - git_safety_gate
  default_commit_mode: no_commit_until_owner_confirmed
  required_outputs:
  - codex_receipt.yaml
  - codex_handoff.md
  - changed_files
  - commands_run
  - test_results
  - diff_summary
  validation_rules:
  - id: codex_only_allowed_files
    severity: blocker
    check: changed_files subset_of dispatch.allowed_files
  - id: codex_no_forbidden_files
    severity: blocker
    check: changed_files intersection dispatch.forbidden_files is empty
  - id: codex_no_unauthorized_commit
    severity: blocker
    check: git_commit only if owner_authorized == true
safety_gates:
  codex_safety_gate:
    purpose: ensure_codex_can_execute_without_clarification_or_version_isolation
    possible_decisions:
    - GO
    - GO_WITH_ADJUSTMENTS
    - NEEDS_CLARIFICATION
    - NEEDS_VERSION_ISOLATION
    - NO_GO
    required_checks:
    - approved_dispatch_exists
    - allowed_files_defined
    - forbidden_files_defined
    - required_commands_defined
    - scope_clear
  git_safety_gate:
    purpose: ensure_repository_state_is_safe_before_modification_or_commit
    possible_decisions:
    - pass
    - fail
    - hold
    required_checks:
    - branch_checked
    - baseline_commit_checked
    - dirty_tree_checked
    - forbidden_files_not_dirty_or_explained
    - commit_mode_checked
commit_gate:
  modes:
    c0_default_manual_confirm:
      owner_confirmation_required: true
      codex_may_commit: false_until_confirmed
    c1_end_to_end_package_authorized:
      owner_commit_authorized_required: true
      codex_may_commit_after_gate: true
  hard_requirements:
  - git_safety_gate_passed
  - diff_only_allowed_files
  - forbidden_files_not_modified
  - ds_post_execution_review_passed_or_accepted_with_known_issues
  - smoke_done_or_explicitly_exempted
  - pm_runtime_summary_generated
  - recommended_commit_message_recorded
  forbidden:
  - pm_runtime_git_commit
  - ds_team_git_commit
  - auto_commit_after_ds_pass
  - auto_commit_after_smoke_pass
  - commit_with_unexplained_dirty_tree
closeout_gate:
  owner_control_only: true
  valid_decisions:
  - pass
  - pass_with_known_issues
  - patch_required
  - fail
  - hold
  not_closeout_signals:
  - hermes_completed
  - pm_runtime_summary
  - ds_pass
  - ds_acceptance_verdict
  - codex_delivered
  - report_generated
  - document_written_in_chat
  - context_packet_absorbed
  - project_memory_updated
  required_checkpoints:
  - authority_source_confirmed
  - current_stage_confirmed
  - repository_landing_status_confirmed
  - paths_exist_or_reported_as_unverified
  - receipts_reports_summaries_complete
  - process_issues_handled
  - blockers_handled
  - forbidden_files_checked
  - scope_expansion_checked
  - next_step_identified
hold_conditions:
- id: missing_workflow_authority
  severity: blocker
  trigger: workflow_core unavailable or authority path unresolved
  action: hold_return_to_owner_control
- id: missing_agent_specific_instruction_when_required
  severity: major
  trigger: role-specific instruction required but unavailable
  action: request_context_or_hold
- id: missing_iteration_doc_or_task_card_or_dispatch
  severity: blocker
  trigger: execution requested without task contract
  action: hold_until_dispatch_exists
- id: missing_allowed_or_forbidden_files
  severity: blocker
  trigger: codex or execution task lacks file boundary
  action: hold_until_scope_defined
- id: unclear_path_state
  severity: major
  trigger: repository path or artifact path cannot be confirmed
  action: request_pm_or_ds_path_audit
- id: unexplained_dirty_tree
  severity: blocker
  trigger: dirty tree exists without explanation
  action: hold_for_git_safety_check
- id: ds_required_team_mode_not_used
  severity: major
  trigger: team_mode_required true but team_mode_used false
  action: mark_process_issue_or_hold
- id: ds_required_mcp_not_used_without_reason
  severity: major
  trigger: mcp_required true but mcp_used false without reason
  action: mark_process_issue_or_hold
- id: codex_touched_forbidden_files
  severity: blocker
  trigger: changed_files intersects forbidden_files
  action: hold_return_to_owner_control
- id: pm_runtime_attempted_closeout
  severity: blocker
  trigger: pm runtime claims final closeout
  action: reject_closeout_and_return_to_owner_control
- id: scope_expansion
  severity: blocker
  trigger: any agent expands task scope without approval
  action: hold_return_to_owner_control
- id: document_body_written_but_not_repository_landed
  severity: major
  trigger: chat artifact treated as repository file
  action: correct_status_to_not_repository_landed
- id: context_packet_treated_as_system_prompt_update
  severity: major
  trigger: transitional context treated as formal system prompt update
  action: correct_status_to_transitional_context_only
- id: missing_real_artifact_paths
  severity: blocker
  trigger: report or receipt claimed but no path provided
  action: hold_until_paths_provided
- id: unresolved_authority_conflict
  severity: blocker
  trigger: workflow_core compact yaml or agent instruction conflict
  action: hold_return_to_owner_control
standard_outputs:
  control_agent_non_execution:
    fields:
      judgment:
        type: string
        required: true
      reason:
        type: string
        required: true
      risk:
        type: string
        required: false
      recommended_next_step:
        type: string
        required: true
  control_agent_execution:
    fields:
      current_status:
        type: string
        required: true
      current_stage:
        type: string
        required: true
      blocker:
        type: string_or_list
        required: true
      single_next_step:
        type: string
        required: true
      executor:
        type: enum
        enum_ref: executor_type
        required: true
      owner_approval_required:
        type: boolean
        required: true
      complete_prompt:
        type: string
        required: conditional
  after_agent_artifact:
    fields:
      received_artifact:
        type: string_or_list
        required: true
      key_conclusion:
        type: string
        required: true
      process_issues:
        type: list_string
        required: true
      blockers:
        type: list_string
        required: true
      gate_judgment:
        type: enum
        enum_ref: gate_decision
        required: true
      single_next_step:
        type: string
        required: true
file_first_delivery:
  applies_to:
  - system_prompt
  - role_card
  - agent_specific_instruction
  - compact
  - template
  - task_card
  - dispatch
  - long_prompt
  - long_report
  default_behavior:
  - generate_downloadable_markdown_or_txt
  - provide_summary_and_link_in_chat
  - split_into_parts_only_if_user_requests_chat_display
agent_asset_layout:
  root: docs/skills/workflow_v4.0/
  workflow_core:
    path: workflow_core/
    files:
    - workflow_core_v4.0_r2.md
    - workflow_compact_v0.3.md
    - workflow_compact_v0.3.3.yaml
  control_agent:
    path: control_agent/
    folders:
    - system_prompt/
    - specific_instruction/
  pm_runtime:
    path: pm_runtime/
    folders:
    - specific_instruction/
    - skills/
  ds_team:
    path: ds_team/
    folders:
    - specific_instruction/
    - skills/
  codex:
    path: codex/
    folders:
    - specific_instruction/
    - skills/
  validation_rules:
  - id: global_compact_under_workflow_core
    severity: major
    check: global compact files are only under workflow_core
  - id: no_per_agent_compact_by_default
    severity: major
    check: agent folders do not contain compact unless named quickref and explicitly non-authoritative
operator_memory:
  lines:
  - Do not guess.
  - Do not overstep role boundaries.
  - Do not make Owner a manual messenger.
  - Execution completed is not version closeout.
  - PM Runtime recovery is not closeout.
  - Compact is not workflow authority.
  - External work defaults to PM Runtime orchestration.
  - First locate the task in the pipeline, then freeze boundary, then dispatch, then return to Owner-Control.
communication_substrate_contract_index:
  contract_version: v0.1
  status: draft_candidate_pending_repository_landing
  directory_policy: bootstrap_two_level_domain_short_task
  task_status_enum_ref: enums.task_status
  runtime_state_enum_ref: enums.runtime_state
  execution_modes_enum_ref: enums.execution_mode
  owner_decision_event_type_enum_ref: enums.owner_decision_event_type
  owner_decision_option_enum_ref: enums.owner_decision_option
  required_runtime_artifacts:
  - runtime/pre_action_check.yaml
  - runtime/registry_events.jsonl
  - logs/stdout.log
  - logs/stderr.log
  - summary/pm_runtime_summary.md
  bootstrap_caveat: This is a machine index for bootstrap alignment; it does not finalize the production task/document management
    model.
