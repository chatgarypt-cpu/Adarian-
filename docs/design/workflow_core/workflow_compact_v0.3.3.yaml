  - executor_failed
  - summary_written
  - not_started
  - running
  - completed
  - failed
  - timeout
  - partial_output_recovered
  - artifact_missing
  - environment_blocked
  - hold_required
  execution_mode:
  - managed_relay_session
  - managed_codex_exec
  - manual_transport
