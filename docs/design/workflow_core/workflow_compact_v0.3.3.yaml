task_lifecycle:
  states:
  - proposed
  - approved
  - running
  - completed
  - failed
  - hold
  - closed
  - archived
  initial_state: proposed
  terminal_states:
  - closed
  - archived
  transitions:
  - from: proposed
    to: approved
    allowed_by:
    - owner
    - approved_auto_policy
  - from: proposed
    to: hold
    allowed_by:
    - control_agent
    - pm_runtime
  - from: approved
    to: running
    allowed_by:
    - pm_runtime
  - from: running
    to: completed
    allowed_by:
    - pm_runtime
    required_evidence:
    - runtime_result
    - required_outputs_checked
  - from: running
    to: failed
    allowed_by:
    - pm_runtime
    required_evidence:
    - runtime_result
    - failure_reason
  - from: running
    to: hold
    allowed_by:
    - pm_runtime
    - control_agent
    required_evidence:
    - blocker_or_missing_context
  - from: completed
    to: closed
    allowed_by:
    - owner_control
    required_evidence:
    - closeout_decision
  - from: completed
    to: hold
