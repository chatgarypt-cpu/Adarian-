metadata:
  asset_id: workflow_compact
  schema_version: 0.3.3
  asset_version: v0.3.3
  status: bootstrap_alignment_candidate
  repository_landed: false
  compatible_workflow_core_version: v4.0-r2
  compatible_human_compact_version: v0.3
  canonical_target_path: docs/skills/workflow_v4.0/workflow_core/workflow_compact_v0.3.3.yaml
  human_compact_target_path: docs/skills/workflow_v4.0/workflow_core/workflow_compact_v0.3.md
  workflow_core_target_path: docs/skills/workflow_v4.0/workflow_core/workflow_core_v4.0_r2.md
  generated_after_review:
    review_id: ds-runtime-contract-review-20260522
    verdict: pass_with_known_issues
    required_patch: yaml_v0.3.3_bootstrap_alignment
  owner: Owner-Control
  language: zh-CN
  patched_from: workflow_compact_v0.3.2.yaml
  patch_reason: 'bootstrap alignment for PM Runtime Communication Substrate Runtime Contract v0.1: directory policy, runtime_state
    enum, bootstrap workspace caveat'
authority:
  authority_level: non_authoritative_machine_index
  workflow_core_is_authority: true
  this_yaml_is_authority: false
  human_compact_is_authority: false
  agent_specific_instruction_is_authority: false
  allowed_use:
  - route_lookup
  - contract_index
  - validation_hint
  - task_directory_check
  - gate_check_helper
  forbidden_use:
  - replace_workflow_core
  - override_workflow_core
  - decide_final_closeout
  - authorize_execution_by_itself
  conflict_policy:
    compact_vs_workflow_core: use_workflow_core
    yaml_vs_workflow_core: use_workflow_core
    agent_instruction_vs_workflow_core: use_workflow_core
    unresolved_three_way_conflict: hold_return_to_owner_control
  transitional_context_policy:
    context_packet_is_authority: false
    context_packet_usage: transitional_context_only
    if_workflow_core_is_draft: state_transitional_status_and_hold_final_authority_judgment
definitions:
  abbreviations:
    DS: DeepSeek-backed review team / audit team
    PM: Project Management Runtime / task middleware
    Hermes: current PM Runtime implementation
    Codex: code execution agent
    S-Level: small low-risk task
    M-Level: medium standard iteration task
    L-Level: large architecture or authority-level task
    HOLD: stop and return to Owner-Control for missing context, conflict, or risk
enums:
  task_level:
  - s_level
  - m_level
  - l_level
  - patch_lane
  task_status: &id001
