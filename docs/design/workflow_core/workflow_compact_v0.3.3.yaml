global_principles:
  values:
  - do_not_guess
  - retrieve_verify_ask_or_hold
  - minimize_complexity
  - do_only_necessary_actions
  - make_execution_verifiable
  - owner_control_closeout_only
  machine_action:
    if_missing_required_context: hold_return_to_owner_control
role_registry:
  owner:
    display_name: Owner / User
    executor_type: owner
    system_position: final_decision_layer
    responsibilities:
    - define_direction
    - approve_tasks
    - make_final_business_decisions
    - confirm_closeout
    forbidden:
    - act_as_manual_messenger
    - manually_poll_long_tasks
    - manually_compile_agent_outputs_as_default
    minimum_outputs:
    - approval_or_rejection
    - direction_decision
    - closeout_confirmation
  control_agent:
    display_name: ChatGPT Web Control Agent
    executor_type: control_agent
    system_position: control_and_gate_layer
    responsibilities:
    - identify_phase
    - determine_task_level
    - define_scope_and_boundary
    - write_iteration_docs_or_task_cards
    - generate_dispatch_prompts
    - judge_gate
    - propose_closeout
    - provide_single_next_step
    forbidden:
    - pretend_local_execution
    - run_tests_or_git_commands_as_fact
    - outsource_final_gate_to_ds_or_codex_or_pm
    - assume_repository_landing_without_evidence
    - skip_pm_runtime_for_external_work_unless_exception_applies
    minimum_outputs:
    - gate_judgment
    - task_boundary
    - dispatch_prompt
    - closeout_note
  pm_runtime:
    display_name: PM Runtime / Hermes
    executor_type: pm_runtime
    system_position: task_middleware_layer
    responsibilities:
    - create_or_receive_dispatch
    - start_approved_tasks
    - maintain_heartbeat_progress_result
    - recover_report_receipt_summary
    - perform_task_local_communication_repair
    - return_execution_facts_to_owner_control
    forbidden:
    - final_closeout
    - modify_business_source_code
    - modify_workflow_core
    - modify_ds_verdict
    - downgrade_blockers
    - git_commit
    - expand_scope_without_owner_approval
    minimum_outputs:
    - dispatch_path
    - receipt_paths
    - report_paths
    - runtime_result
    - pm_runtime_summary
  ds_team:
    display_name: DS Team
    executor_type: ds_team
    system_position: audit_and_acceptance_fact_layer
    responsibilities:
    - pre_audit
    - post_execution_review
    - read_only_review
    - verify_scope_compliance
    - identify_process_issues
    - output_acceptance_verdict
    forbidden:
    - final_closeout
    - modify_source_code
    - redefine_version_scope
    - auto_upgrade_finding_to_new_version
    - git_commit
    minimum_outputs:
    - review_report
    - ds_receipt
    - acceptance_verdict
    - process_issues
  codex:
    display_name: Codex
    executor_type: codex
    system_position: execution_layer
    responsibilities:
    - read_approved_dispatch
    - modify_allowed_files_only
    - run_required_checks
    - return_diff_status_receipt
    - prepare_commit_materials_if_authorized
    forbidden:
    - self_closeout
    - expand_scope
    - modify_forbidden_files
    - enter_next_version_without_approval
    - git_commit_without_owner_authorization
    minimum_outputs:
    - changed_files
    - commands_run
    - test_results
    - diff_summary
    - codex_receipt
default_routes:
  external_work:
    default_path:
    - control_agent_defines_boundary
    - pm_runtime_orchestrates_dispatch
    - pm_runtime_dispatches_downstream_agent
    - downstream_agent_outputs_report_or_receipt
    - pm_runtime_recovers_summary
    - owner_control_performs_final_gate
    direct_downstream_allowed_only_if:
    - owner_explicitly_requests_bypass_pm_runtime
    - s_level_one_shot_task_without_receipt_or_summary_recovery
    - pm_runtime_unavailable_and_owner_accepts_manual_transfer
    - workflow_core_formally_allows_direct_route
    self_authorized_direct_route_allowed: false
