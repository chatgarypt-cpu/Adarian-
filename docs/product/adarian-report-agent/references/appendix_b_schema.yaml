version: 1
top_level_keys:
  - meta
  - evolution_analysis
  - source_evidence
  - risk_assessment
  - countermeasures

fields:
  - path: meta.event_name
    kind: source
    source_fields:
      - input_json.event_name
    allowed_in_body: true
  - path: meta.generated_at
    kind: derived
    derived_from:
      - current_run_timestamp
    allowed_in_body: false
  - path: meta.worlds_count
    kind: derived
    derived_from:
      - input_json.worlds
    allowed_in_body: false

  - path: evolution_analysis.worlds_count
    kind: derived
    derived_from:
      - input_json.worlds
    allowed_in_body: false
  - path: evolution_analysis.event_scale_avg
    kind: derived
    derived_from:
      - datasets[].run_info.event_scale
    allowed_in_body: false
  - path: evolution_analysis.event_scale_distribution
    kind: source_list
    source_fields:
      - datasets[].run_info.event_scale
    allowed_in_body: false
  - path: evolution_analysis.event_controversy_avg
    kind: derived
    derived_from:
      - datasets[].run_info.event_controversy
    allowed_in_body: false
  - path: evolution_analysis.event_controversy_distribution
    kind: source_list
    source_fields:
      - datasets[].run_info.event_controversy
    allowed_in_body: false
  - path: evolution_analysis.risk_level_distribution
    kind: derived
    derived_from:
      - datasets[].simulation_result.risk_verdict.level
    allowed_in_body: false
  - path: evolution_analysis.risk_type_frequency
    kind: derived
    derived_from:
      - datasets[].simulation_result.risk_type_classification.primary_types
    allowed_in_body: false
  - path: evolution_analysis.worst_reasonable_level
    kind: derived
    derived_from:
      - datasets[].simulation_result.risk_verdict.level
      - aggregation_config.risk_level_order
    allowed_in_body: true
  - path: evolution_analysis.worst_reasonable_level_label
    kind: derived
    derived_from:
      - datasets[].simulation_result.risk_verdict.label
      - aggregation_config.risk_level_order
    allowed_in_body: true
  - path: evolution_analysis.outlier_worlds
    kind: derived
    derived_from:
      - datasets[].simulation_result.risk_verdict.level
      - aggregation_config.risk_level_order
    allowed_in_body: false
  - path: evolution_analysis.entities
    kind: source
    source_fields:
      - dataset.source_context.event_entities
    allowed_in_body: true
  - path: evolution_analysis.opinion_spreaders
    kind: source
    source_fields:
      - dataset.source_context.opinion_spreaders
    allowed_in_body: false
  - path: evolution_analysis.emotion_trajectory
    kind: source_list
    source_fields:
      - datasets[].simulation_result.emotion_trajectory
    allowed_in_body: false
  - path: evolution_analysis.agent_stance_matrix
    kind: source_list
    source_fields:
      - datasets[].simulation_result.agent_stance_matrix
    allowed_in_body: false
  - path: evolution_analysis.inflection_points
    kind: source_list
    source_fields:
      - datasets[].simulation_result.inflection_points
    allowed_in_body: false

  - path: source_evidence.worlds
    kind: source_list
    source_fields:
      - datasets[].simulation_result.risk_verdict
      - datasets[].simulation_result.risk_type_classification
    allowed_in_body: false
    filter_strategy: bounded_by_aggregation_config_only

  # NOTE: The exact key name is "risks", NOT "confirmed_risks". LLM must write to this path.
  - path: risk_assessment.risks
    kind: llm_derived
    derived_from:
      - source_evidence.worlds
      - evolution_analysis
      - risk_rules.yaml
      - risk_mapping.yaml
    allowed_in_body: true
  - path: risk_assessment.no_confirmed_risks_reason
    kind: llm_derived
    derived_from:
      - source_evidence.worlds
      - evolution_analysis
      - risk_rules.yaml
    allowed_in_body: true
  - path: countermeasures.measures
    kind: llm_derived
    derived_from:
      - risk_assessment.risks
      - countermeasure_templates.yaml
    allowed_in_body: true
