version: 1

numeric_metrics:
  # aggregate is informational only — the script always computes the mean.
  # Only "mean" is supported; changing this field has no effect.
  - output_prefix: event_scale
    source_path: run_info.event_scale
    aggregate: mean
    keep_distribution: true
  - output_prefix: event_controversy
    source_path: run_info.event_controversy
    aggregate: mean
    keep_distribution: true

frequency_metrics:
  risk_level_distribution:
    source_path: simulation_result.risk_verdict.level
  risk_type_frequency:
    source_path: simulation_result.risk_type_classification.primary_types

risk_level_order:
  low: 1
  medium: 2
  high: 3
  critical: 4

bounded_source_evidence:
  risk_verdict:
    - level
    - label
    - basis_text
    - signals
  risk_type_classification:
    - primary_types
    - type_labels
    - primary_domain
    - primary_domain_label

evolution_source_fields:
  - source_context.event_entities
  - source_context.opinion_spreaders
  - simulation_result.emotion_trajectory
  - simulation_result.agent_stance_matrix
  - simulation_result.inflection_points
