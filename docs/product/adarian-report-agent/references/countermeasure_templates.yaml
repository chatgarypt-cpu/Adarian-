version: 1

selection_rules:
  allow_one_template_per_type_v1: true
  must_match_risk_type_id: true
  must_use_paired_risk_label: true
  must_reference_trigger_reason: true
  must_preserve_level_direction: true
  reject_if_measure_drifts_from_paired_risk: true
  pair_references:
    trigger_reason_ref: trigger_reason
    level_id_ref: level_id

defaults:
  - responsible_body: 事件主体
    action_direction: 信息公开与解释回应
    measure_template: 围绕{risk_label}，由事件主体尽快发布事实说明、处置进展和后续安排，降低误读空间。
  - responsible_body: 主管部门
    action_direction: 规则澄清与协同处置
    measure_template: 围绕{risk_label}，由相关主管部门明确政策边界和处置口径，避免责任真空。

templates:
  regulatory_trust_risk:
    - responsible_body: 主管部门
      action_direction: 监管回应
      measure_template: 对公众关注的监管责任、处置依据和后续检查安排作出说明。
  law_enforcement_credibility_risk:
    - responsible_body: 执法机关
      action_direction: 程序透明
      measure_template: 公开关键执法程序和依据，回应程序公正疑问。
  transparency_risk:
    - responsible_body: 事件主体
      action_direction: 信息披露
      measure_template: 按时间线披露事实、责任、整改和复盘结果。
  accountability_escalation_risk:
    - responsible_body: 责任主体
      action_direction: 问责闭环
      measure_template: 明确责任认定、整改责任人和可核验时间表。
  policy_interpretation_pressure_risk:
    - responsible_body: 政策主管部门
      action_direction: 政策解释
      measure_template: 用问答式口径解释政策适用范围和争议边界。
  food_product_safety_risk:
    - responsible_body: 市场监管部门
      action_direction: 安全核验
      measure_template: 发布检测、抽检或召回安排，回应安全疑虑。
  campus_minor_protection_risk:
    - responsible_body: 教育主管部门
      action_direction: 保护机制
      measure_template: 明确未成年人和校园相关保护措施。
  public_safety_concern_risk:
    - responsible_body: 属地政府
      action_direction: 风险排查
      measure_template: 组织安全排查并公布阶段性结果。
  livelihood_vulnerable_protection_risk:
    - responsible_body: 民生部门
      action_direction: 兜底保障
      measure_template: 建立弱势群体诉求接收、核查和反馈机制。
  public_health_event_risk:
    - responsible_body: 卫健部门
      action_direction: 健康风险沟通
      measure_template: 发布健康提示、处置进展和权威答疑。
  environmental_ecological_risk:
    - responsible_body: 生态环境部门
      action_direction: 监测公开
      measure_template: 公布监测指标、治理计划和复测安排。
  negative_narrative_aggregation_risk:
    - responsible_body: 事件主体
      action_direction: 叙事纠偏
      measure_template: 针对集中负向叙事逐项回应事实与改进措施。
  group_polarization_fragmentation_risk:
    - responsible_body: 平台与事件主体
      action_direction: 降低对立
      measure_template: 避免刺激性回应，推动事实澄清和理性讨论。
  secondary_spread_issue_overflow_risk:
    - responsible_body: 事件主体
      action_direction: 议题边界管理
      measure_template: 区分原始争议与外溢议题，分别制定回应口径。
  rumor_fact_confusion_risk:
    - responsible_body: 平台方
      action_direction: 谣言澄清
      measure_template: 标注不实信息，建立事实核验入口。
  ai_deepfake_abuse_risk:
    - responsible_body: 平台方
      action_direction: 技术识别
      measure_template: 启动疑似伪造内容识别、标注和下架流程。
  data_network_security_risk:
    - responsible_body: 网信与平台方
      action_direction: 数据安全说明
      measure_template: 说明数据处理边界、保护措施和核查结果。
  ideology_foreign_narrative_risk:
    - responsible_body: 宣传与外事相关部门
      action_direction: 叙事引导
      measure_template: 用事实材料回应价值观或涉外叙事误读。
  tech_ethics_ai_governance_risk:
    - responsible_body: 科技治理部门
      action_direction: 伦理规则
      measure_template: 明确技术伦理边界、审查流程和纠偏机制。
  public_service_response_pressure_risk:
    - responsible_body: 公共服务部门
      action_direction: 服务响应
      measure_template: 增设咨询入口，公布办理标准和反馈时限。
  grassroots_governance_pressure_risk:
    - responsible_body: 属地基层组织
      action_direction: 基层减压
      measure_template: 统一解释口径，减少基层重复解释和被动承压。
  cross_dept_coordination_boundary_risk:
    - responsible_body: 牵头部门
      action_direction: 跨部门协同
      measure_template: 明确牵头单位、配合单位和责任边界。
  platform_governance_consumer_overflow_risk:
    - responsible_body: 平台与企业
      action_direction: 消费争议治理
      measure_template: 建立投诉处置、争议调解和平台规则说明机制。
  financial_market_instability_risk:
    - responsible_body: 金融监管部门
      action_direction: 稳定预期
      measure_template: 发布权威风险提示和市场稳定口径。
  local_debt_fiscal_risk:
    - responsible_body: 财政部门
      action_direction: 财政信息说明
      measure_template: 说明债务处置安排、财政承压边界和保障措施。
  employment_labor_dispute_risk:
    - responsible_body: 人社部门
      action_direction: 劳动权益保障
      measure_template: 开通投诉核查通道，明确欠薪、裁员等争议处理流程。
  housing_estate_risk:
    - responsible_body: 住建部门
      action_direction: 房地产风险处置
      measure_template: 公布项目处置进展、资金监管和交付保障安排。
  financial_fraud_illegal_fundraising_risk:
    - responsible_body: 金融监管与公安机关
      action_direction: 风险提示与打击
      measure_template: 发布风险提示，公布核查、止付和追赃进展。
