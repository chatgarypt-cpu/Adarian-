              for l in lines:
                  print(f"  | {l.rstrip()}")
      sys.stdout.flush()
      time.sleep(1)
      
      print("[5/5] Dispatch ready for DS Team consumption")
      print("=== DS Real Relay Test Complete ===")
      sys.stdout.flush()
      time.sleep(0.5)
      
      # Write a simple result
      result = {
          "task_id": "ds-relay-verify-v0.1.1-20260523",
          "status": "dispatched",
          "dispatch_file": dispatch_path,
          "dispatch_found": exists,
          "dispatch_size": size if exists else 0,
