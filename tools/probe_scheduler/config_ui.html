<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平行世界调度器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system, "Helvetica Neue", sans-serif;
         background: #f5f5f7; color: #1d1d1f; padding: 20px; }
  .wrap { max-width: 1000px; margin: 0 auto; }

  /* ── Config View ── */
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: #86868b; margin-bottom: 20px; }
  .config-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .config-bar label { font-size: 13px; color: #555; }
  .config-bar input { font: 13px inherit; padding: 6px 10px; border: 1px solid #d2d2d7;
                      border-radius: 6px; background: #fff; width: 180px; }

  table { width: 100%; border-collapse: collapse; background: #fff;
          border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600;
       color: #86868b; text-transform: uppercase; background: #f5f5f7; border-bottom: 1px solid #e8e8ed; }
  td { padding: 6px 12px; border-bottom: 1px solid #e8e8ed; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }

  .col-cb { width: 36px; text-align: center; }
  .col-name { width: 170px; font-weight: 500; font-family: "SF Mono", monospace; font-size: 13px; }
  .col-desc { color: #555; font-size: 13px; }
  .col-status { width: 90px; text-align: center; font-size: 12px; }
  .col-act { width: 70px; text-align: center; }

  .status-ok { color: #30d158; font-weight: 600; }
  .status-fail { color: #ff453a; font-weight: 600; }
  .status-pending-test { color: #86868b; }
  .status-testing { color: #007aff; }

  button { font: 13px inherit; padding: 6px 16px; border: none; border-radius: 6px;
           cursor: pointer; transition: .15s; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: default; }

  .btn-test { background: #007aff; color: #fff; padding: 4px 12px; font-size: 12px; }
  .btn-test-sm { background: transparent; color: #007aff; padding: 2px 8px; font-size: 12px;
                  border: 1px solid #007aff; }
  .btn-launch { background: #30d158; color: #fff; font-size: 15px; font-weight: 600;
                padding: 10px 32px; }
  .btn-launch:disabled { background: #c7c7cc; }

  .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .summary { font-size: 13px; color: #86868b; }
  .summary strong { color: #1d1d1f; }

  .msg { margin-top: 12px; padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .msg-ok { background: #e8f8ee; color: #1a7a3a; display: block; }
  .msg-err { background: #fde8e8; color: #a11; display: block; }

  .model-check { width: 18px; height: 18px; cursor: pointer; }

  /* ── Monitor View ── */
  .monitor-view { display: none; }

  .monitor-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .monitor-title { font-size: 18px; font-weight: 600; flex: 1; }
  .monitor-back { background: transparent; color: #007aff; font-size: 13px; padding: 4px 12px; border: 1px solid #007aff; border-radius: 6px; cursor: pointer; }

  .monitor-tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0; margin-bottom: 0; }
  .monitor-tab { padding: 8px 16px; font-size: 13px; border-radius: 8px 8px 0 0;
                 cursor: pointer; white-space: nowrap; border: 1px solid #e8e8ed; border-bottom: none;
                 background: #f5f5f7; color: #86868b; flex-shrink: 0; }
  .monitor-tab:hover { background: #eee; }
  .monitor-tab.active { background: #fff; color: #1d1d1f; font-weight: 500; border-color: #d2d2d7; }
  .monitor-tab .tab-icon { margin-right: 4px; }

  .monitor-panel { background: #fff; border: 1px solid #d2d2d7; border-radius: 0 8px 8px 8px;
                   padding: 16px; min-height: 300px; }
  .monitor-panel-head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px;
                         flex-wrap: wrap; }
  .monitor-panel-head .model-badge { font-family: "SF Mono", monospace; font-size: 13px;
                                      background: #f5f5f7; padding: 4px 10px; border-radius: 4px; }
  .monitor-panel-head .elapsed { color: #86868b; font-size: 13px; }
  .monitor-panel-head .error-badge { background: #fde8e8; color: #a11; font-size: 12px;
                                      padding: 4px 10px; border-radius: 4px; flex: 1; }

  .monitor-log { background: #1d1d1f; color: #30d158; font: 12px/1.5 "SF Mono", monospace;
                 padding: 12px; border-radius: 6px; max-height: 400px; overflow-y: auto;
                 white-space: pre-wrap; word-break: break-all; }
  .monitor-log-empty { background: #f5f5f7; color: #86868b; font-size: 13px; padding: 24px;
                        text-align: center; border-radius: 6px; }

  .monitor-bottom { margin-top: 12px; padding: 10px 16px; background: #fff;
                     border: 1px solid #d2d2d7; border-radius: 8px;
                     display: flex; gap: 16px; align-items: center; font-size: 13px; }
  .monitor-bottom .stat { display: flex; align-items: center; gap: 4px; }
  .monitor-bottom .stat-num { font-weight: 600; font-size: 15px; }
  .stat-ok { color: #30d158; }
  .stat-fail { color: #ff453a; }
  .stat-running { color: #007aff; }
  .stat-pending-bottom { color: #86868b; }

  .monitor-error-list { margin-top: 8px; }
  .monitor-error-item { font-size: 12px; color: #a11; background: #fde8e8; padding: 6px 10px;
                         border-radius: 4px; margin-bottom: 4px; font-family: "SF Mono", monospace; }

  /* ── 隐藏视图切换 ── */
  .view-config, .view-monitor { display: block; }
  .view-monitor { display: none; }
  body.monitoring .view-config { display: none; }
  body.monitoring .view-monitor { display: block; }
</style>
</head>
<body>
<div class="wrap">

<!-- ══════════ Config View ══════════ -->
<div class="view-config">
  <h1>🌐 平行世界调度器</h1>
  <p class="sub">选择模型 → Hello Test 验证 → 启动</p>

  <div class="config-bar">
    <label>Seed:</label>
    <input id="seed" value="seeds/test8.txt" placeholder="seeds/test8.txt">
    <label>批次标识:</label>
    <input id="tag" value="parallel" placeholder="parallel">
  </div>

  <table id="model-table">
    <thead>
      <tr>
        <th class="col-cb"><input type="checkbox" id="select-all" class="model-check"></th>
        <th class="col-name">模型</th>
        <th class="col-desc">说明</th>
        <th class="col-status">状态</th>
        <th class="col-act">测试</th>
      </tr>
    </thead>
    <tbody id="model-list"></tbody>
  </table>

  <div class="actions">
    <button class="btn-test" id="btn-test-all" disabled>▶ Hello Test All</button>
    <button class="btn-launch" id="btn-launch" disabled>🚀 Launch</button>
    <span class="summary">已选 <strong id="selected-count">0</strong> 个模型</span>
  </div>
  <div id="msg" class="msg"></div>
</div>

<!-- ══════════ Monitor View ══════════ -->
<div class="view-monitor">
  <div class="monitor-top">
    <div class="monitor-title">🌐 <span id="monitor-title">平行世界</span></div>
    <button class="monitor-back" id="btn-back">← 返回配置</button>
  </div>

  <div class="monitor-tabs" id="monitor-tabs"></div>

  <div class="monitor-panel" id="monitor-panel">
    <div class="monitor-panel-head" id="panel-head"></div>
    <div class="monitor-log" id="panel-log"><div class="monitor-log-empty">等待数据...</div></div>
    <div class="monitor-error-list" id="error-list"></div>
  </div>

  <div class="monitor-bottom" id="monitor-bottom"></div>
</div>

</div>

<script>
// ── 状态 ──
let models = [];
let statuses = {};
let sessionDir = "";       // batch_dir from launch
let sessionWorlds = [];    // [{name, model, label}]
let pollTimer = null;
let activeTab = 0;

// ── 加载模型列表 ──
async function loadModels() {
  const resp = await fetch("/api/models");
  const data = await resp.json();
  models = Object.entries(data).map(([id, desc]) => ({id, desc}));
  render();
  updateButtons();
}

// ── 渲染配置表 ──
function render() {
  const tbody = document.getElementById("model-list");
  tbody.innerHTML = models.map((m, i) => `
    <tr>
      <td class="col-cb"><input type="checkbox" class="model-check row-cb" data-idx="${i}"></td>
      <td class="col-name">${m.id}</td>
      <td class="col-desc">${m.desc}</td>
      <td class="col-status" id="status-${m.id}">${statusCell(m.id)}</td>
      <td class="col-act"><button class="btn-test-sm" onclick="testOne('${m.id}')">测试</button></td>
    </tr>
  `).join("");
}

function statusCell(id) {
  const s = statuses[id];
  if (!s) return '<span class="status-pending-test">—</span>';
  if (s.status === "testing") return '<span class="status-testing">⏱</span>';
  if (s.status === "ok") return `<span class="status-ok">✓ ${s.elapsed}s</span>`;
  if (s.status === "fail") return `<span class="status-fail">✗ ${s.error || "?"}</span>`;
  return '<span class="status-pending-test">—</span>';
}

document.getElementById("select-all").addEventListener("change", function() {
  document.querySelectorAll(".row-cb").forEach(cb => cb.checked = this.checked);
  updateButtons();
});

document.addEventListener("change", e => {
  if (e.target.classList.contains("row-cb")) {
    const all = document.querySelectorAll(".row-cb");
    document.getElementById("select-all").checked = [...all].every(cb => cb.checked);
    updateButtons();
  }
});

function getSelected() {
  return [...document.querySelectorAll(".row-cb:checked")].map(cb => models[+cb.dataset.idx].id);
}

function updateButtons() {
  const sel = getSelected();
  document.getElementById("selected-count").textContent = sel.length;
  document.getElementById("btn-test-all").disabled = sel.length === 0;
  document.getElementById("btn-launch").disabled = sel.length < 2;
}

// ── Hello Test ──
async function testOne(model) {
  statuses[model] = {status: "testing"};
  render();
  try {
    const resp = await fetch("/api/hello-test", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({model}),
    });
    const data = await resp.json();
    statuses[model] = {status: data.status, elapsed: data.elapsed, error: data.error};
  } catch (e) {
    statuses[model] = {status: "fail", error: "fetch error"};
  }
  render();
}

document.getElementById("btn-test-all").addEventListener("click", async () => {
  const sel = getSelected();
  msg("正在测试 " + sel.length + " 个模型...", "ok");
  for (const m of sel) await testOne(m);
  const ok = sel.filter(m => statuses[m]?.status === "ok").length;
  const fail = sel.filter(m => statuses[m]?.status === "fail").length;
  if (fail === 0) msg("✅ 全部通过（" + ok + "/" + sel.length + "）", "ok");
  else msg("⚠️ " + ok + " 通过, " + fail + " 不通", "err");
});

function msg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg msg-" + type;
  el.style.display = "block";
}

// ── Launch ──
document.getElementById("btn-launch").addEventListener("click", async () => {
  const sel = getSelected();
  if (sel.length < 2) return;
  const btn = document.getElementById("btn-launch");
  btn.disabled = true;
  btn.textContent = "⏱ 启动中...";
  try {
    const resp = await fetch("/api/launch", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        models: sel,
        seed: document.getElementById("seed").value.trim() || "seeds/test8.txt",
        tag: document.getElementById("tag").value.trim() || "parallel",
      }),
    });
    const data = await resp.json();
    if (data.status === "launched") {
      sessionDir = data.batch_dir;
      sessionWorlds = sel.map((m, i) => ({name: "world_" + i, model: m, label: m}));
      startMonitoring();
    } else {
      msg("❌ " + (data.error || "启动失败"), "err");
    }
  } catch (e) {
    msg("❌ 请求失败: " + e.message, "err");
  }
  btn.textContent = "🚀 Launch";
});

// ══════════════════════════════════════════════════════════════════
// Monitor View
// ══════════════════════════════════════════════════════════════════

function startMonitoring() {
  activeTab = 0;
  document.body.classList.add("monitoring");
  document.getElementById("monitor-title").textContent =
    "平行世界 · " + sessionWorlds.length + " 个模型";

  renderTabs();
  renderPanel();
  renderBottom();
  pollSession();
  pollTimer = setInterval(pollSession, 3000);
}

function stopMonitoring() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  document.body.classList.remove("monitoring");
}

document.getElementById("btn-back").addEventListener("click", stopMonitoring);

// ── 渲染 Tabs ──
function renderTabs() {
  const container = document.getElementById("monitor-tabs");
  container.innerHTML = sessionWorlds.map((w, i) => {
    const active = i === activeTab ? "active" : "";
    return `<div class="monitor-tab ${active}" onclick="switchTab(${i})">
      <span class="tab-icon" id="tab-icon-${w.name}">⏳</span>${w.model}
    </div>`;
  }).join("");
}

function switchTab(idx) {
  activeTab = idx;
  document.querySelectorAll(".monitor-tab").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });
  renderPanel();
}

// ── 渲染面板（当前 tab） ──
function renderPanel() {
  const w = sessionWorlds[activeTab];
  const head = document.getElementById("panel-head");
  const log = document.getElementById("panel-log");
  const errList = document.getElementById("error-list");
  errList.innerHTML = "";

  const ws = window._worldStatus ? window._worldStatus[w.name] : null;
  if (!ws) {
    head.innerHTML = `<span class="model-badge">${w.model}</span><span class="elapsed">等待进程启动...</span>`;
    log.innerHTML = '<div class="monitor-log-empty">⏳ 启动中...</div>';
    return;
  }

  const icon = ws.status === "completed" ? "✓" : ws.status === "failed" ? "✗" : "⏳";
  const statusColor = ws.status === "completed" ? "#30d158" : ws.status === "failed" ? "#ff453a" : "#007aff";
  const elapsed = ws.elapsed ? ws.elapsed + "s" : "";

  head.innerHTML = `
    <span style="font-size:18px;color:${statusColor}">${icon}</span>
    <span class="model-badge">${w.model}</span>
    <span class="elapsed">${elapsed}</span>
    ${ws.error ? '<span class="error-badge">✗ ' + ws.error + '</span>' : ""}
    <span style="font-size:12px;color:#86868b">${ws.dir || ""}</span>
  `;

  if (ws.run_log) {
    log.textContent = ws.run_log.split("\n").slice(-40).join("\n");
  } else {
    log.innerHTML = '<div class="monitor-log-empty">暂无日志</div>';
  }

  // 错误详情（底部汇总区）
  if (ws.status === "failed" && ws.error) {
    errList.innerHTML = `<div class="monitor-error-item">✗ ${w.model}: ${ws.error}</div>`;
  }
}

// ── 渲染底部汇总 ──
function renderBottom() {
  const bottom = document.getElementById("monitor-bottom");
  const data = window._sessionSummary || {total:0, completed:0, failed:0, running:0, pending:0};
  bottom.innerHTML = `
    <div class="stat"><span class="stat-ok stat-num">${data.completed}</span> 完成</div>
    <div class="stat"><span class="stat-fail stat-num">${data.failed}</span> 失败</div>
    <div class="stat"><span class="stat-running stat-num">${data.running}</span> 运行中</div>
    <div class="stat"><span class="stat-pending-bottom stat-num">${data.pending}</span> 等待</div>
    <span style="color:#86868b;margin-left:auto">共 ${data.total} 个世界</span>
  `;
}

// ── 轮询状态 ──
async function pollSession() {
  if (!sessionDir) return;
  try {
    const resp = await fetch("/api/session?dir=" + encodeURIComponent(sessionDir));
    if (!resp.ok) return;
    const data = await resp.json();

    // 存起来供渲染用
    window._sessionSummary = data.summary;
    window._worldStatus = {};
    data.worlds.forEach(w => { window._worldStatus[w.name] = w; });

    // 更新 tab 图标
    data.worlds.forEach(w => {
      const el = document.getElementById("tab-icon-" + w.name);
      if (!el) return;
      if (w.status === "completed") el.textContent = "✓";
      else if (w.status === "failed") el.textContent = "✗";
      else el.textContent = "⏳";
    });

    renderPanel();
    renderBottom();

    // 全部跑完 → 停轮询
    if (data.summary.pending === 0 && data.summary.running === 0) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  } catch (e) {
    // 忽略网络错误
  }
}

// ── 启动 ──
loadModels();
</script>
</body>
</html>
