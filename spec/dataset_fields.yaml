# =====================================================================
# dataset_fields.yaml
#
# 本文件定义 simulation_dataset.json 中各字段的规格说明。
# generator 在读 dataset 时查到对应路径，就把注释压入 YAML 输出。
#
# 格式：
#   <key_path>:               # JSON 中的路径，用 . 分隔
#     type: <类型>
#     description: <一句话说明>
#     source: <上游来源模块>
#     computation: <是否由 LLM/代码计算决定>
#     usage: <在产品端/下游可用作什么>
#     allowed_values: <可选的枚举值>
# =====================================================================

# ── 顶级元信息 ───────────────────────────────────────────────────
_schema_version:
  type: string
  description: 数据集的 schema 版本号
  source: 硬编码
  computation: 代码常量
  usage: 版本兼容检测

_generated_by:
  type: string
  description: 数据集的生成模块标识
  source: 硬编码
  usage: 排查数据集来源

# ── run_info ─────────────────────────────────────────────────────
run_info.event_name:
  type: string
  description: 事件名称/摘要
  source: extraction_output.event_summary
  computation: Phase 1 Analyzer 从种子文本提取
  usage: 报告标题、筛选/检索事件

run_info.event_scale:
  type: float  (0.0-1.0)
  description: 事件影响规模的量化估值（广度）
  source: extraction_output.event_scale
  computation: Phase 1 Analyzer 根据种子文本中涉及的群体数量、地域范围等综合评估
  usage: 产品端决定报告篇幅和受众范围；影响 audience_mode 判定

run_info.event_controversy:
  type: float  (0.0-1.0)
  description: 事件争议强度的量化估值
  source: extraction_output.event_controversy
  computation: Phase 1 Analyzer 根据种子文本中对立立场烈度评估
  usage: 协助风险等级判断；影响 audience_mode 判定

run_info.event_type:
  type: string
  description: 事件类型分类
  source: extraction_output.event_type
  computation: Phase 1 Analyzer 从种子文本语义判定
  usage: 筛选统计；影响 audience_mode 判定

run_info.total_ticks:
  type: int
  description: 模拟总轮数
  source: len(tick_logs)
  computation: 运行时参数 MAX_TICKS
  usage: 报告篇幅控制

run_info.audience_mode:
  type: string (enum)
  description: 受众模式，影响报告措辞风格和风险解读方向
  source: RiskAnalyzer.determine_audience_mode()
  computation: 综合 event_type/scale/controversy 判定
  allowed_values:
    - generic_government: 通用政府（默认，面向政务场景的通用模式）
    - enterprise_crisis: 企业危机（面向企业的公关危机模式）
    - public_figure: 公众人物（面向个人声誉风险模式）
  usage: 产品端选择报告模板；控制 LLM 报告的措辞风格

# ── source_context ──────────────────────────────────────────────
source_context.event_summary:
  type: string
  description: 事件摘要（与 run_info.event_name 相同，为下游消费便利冗余）
  source: extraction_output.event_summary
  usage: 报告引言的直接来源

source_context.event_type:
  type: string
  description: 事件类型（与 run_info.event_type 相同，冗余）
  source: extraction_output.event_type
  usage: 报告分类描述

source_context.event_entities[].name:
  type: string
  description: 事件实体名
  source: extraction_output.event_entities[].name
  computation: Phase 1 Generator 从种子文本提取
  usage: 报告中实体命名引用

source_context.event_entities[].type:
  type: string
  description: 实体类型
  source: extraction_output.event_entities[].type
  allowed_values:
    - organization: 组织/机构
    - person: 个人
    - location: 地点
    - policy: 政策/文件
  usage: 报告中的实体分类

source_context.event_entities[].role:
  type: string
  description: 实体在事件中的角色描述
  source: extraction_output.event_entities[].role
  usage: 报告中解释各方立场背景

source_context.event_entities[].can_speak:
  type: bool
  description: 该实体是否会主动发声（影响 tick 模拟中是否有发言）
  source: extraction_output.event_entities[].can_speak
  usage: 控制 Phase 3 中该实体是否参与每轮发言

source_context.event_entities[].original_statement:
  type: string
  description: 实体的原始表态/声明（种子文本中的引述或推出的典型立场）
  source: extraction_output.event_entities[].original_statement
  usage: 报告引言中的原始表态引用

source_context.opinion_spreaders[].group_name:
  type: string
  description: 意见传播者群体名称
  source: extraction_output.opinion_spreaders[].group_name
  usage: 报告中群体命名引用

source_context.opinion_spreaders[].related_event_entity:
  type: string
  description: 该群体关联的主要事件实体名
  source: extraction_output.opinion_spreaders[].related_event_entity
  usage: 拓扑构建中的关联关系；报告中群体立场背景说明

source_context.opinion_spreaders[].stance_score:
  type: float  (0.0-10.0)
  description: 群体对关联实体的初始立场分数（高=支持，低=反对）
  source: extraction_output.opinion_spreaders[].stance_score
  computation: Phase 1 Generator 从种子文本推断
  usage: Phase 2 拓扑图的立场标注；报告中的群体立场起点

source_context.opinion_spreaders[].estimated_percentage:
  type: int (0-100)
  description: 该群体占总人口的比例估计
  source: extraction_output.opinion_spreaders[].estimated_percentage
  computation: Phase 1 Generator 从种子文本推断，Compiler 归一化到总和 100
  usage: 报告中群体规模说明

# ── simulation_result ──────────────────────────────────────────
simulation_result.x_t_sequence[]:
  type: float[]
  description: 每轮整体舆论倾向均值（均值越高越正面，越低越负面）
  source: SimulationEngine 每轮计算的 mean_stance
  computation: Phase 3 tick 模拟，每轮 global_metrics.mean_stance
  usage: 报告中的稳定性趋势分析；拐点检测的输入

simulation_result.final_x:
  type: float
  description: 最终一轮的舆论倾向均值
  source: x_t_sequence[-1]
  usage: 报告结论中的最终舆论走向

simulation_result.final_polarization_index:
  type: float  (0.0-1.0)
  description: 最终一轮的极化指数（高=群体立场分裂大）
  source: tick_logs[-1].global_metrics.polarization_index
  computation: Phase 3 tick 模拟最后一轮
  usage: 报告中的群体分裂程度指标

simulation_result.emotion_trajectory[].tick:
  type: int
  description: 轮次编号
  source: tick_logs[].tick
  usage: 报告中的时间序列横轴

simulation_result.emotion_trajectory[].mean_stance:
  type: float  (0.0-10.0)
  description: 该轮全体 agent 的立场均值
  source: tick_logs[].global_metrics.mean_stance
  computation: Phase 3 每轮 TickLog 统计
  usage: 报告中的舆论趋势图表

simulation_result.emotion_trajectory[].std_stance:
  type: float
  description: 该轮全体 agent 的立场标准差
  source: tick_logs[].global_metrics.std_stance
  usage: 报告中的群体分歧广度

simulation_result.emotion_trajectory[].polarization_index:
  type: float  (0.0-1.0)
  description: 该轮的极化指数
  source: tick_logs[].global_metrics.polarization_index
  usage: 报告中的极化趋势

simulation_result.emotion_trajectory[].key_event:
  type: string
  description: 该轮的关键事件描述（如有）
  source: 当前为占位符 ""
  usage: 报告中拐点对应的说明

simulation_result.tick_entries[].tick:
  type: int
  description: 轮次编号
  source: tick_logs[].tick
  usage: 数据分组的轮次标识

simulation_result.tick_entries[].entries[].agent_id:
  type: int
  description: Agent 的唯一编号
  usage: 跨轮追踪同一 agent 的立场变化

simulation_result.tick_entries[].entries[].group_name:
  type: string
  description: Agent 所属群体名称
  usage: 报告中群体层面分析

simulation_result.tick_entries[].entries[].comment:
  type: string
  description: Agent 本轮的发言内容
  source: tick_logs[].entries[].comment
  computation: Phase 3 tick 模拟 LLM 生成
  usage: 报告引言中的代表性引述

simulation_result.tick_entries[].entries[].previous_stance:
  type: float  (0.0-10.0)
  description: 上一轮的立场值
  usage: 报告中的立场变化计算

simulation_result.tick_entries[].entries[].current_stance:
  type: float  (0.0-10.0)
  description: 本轮更新后的立场值
  usage: 报告中的当前立场

simulation_result.tick_entries[].entries[].stance_delta:
  type: float
  description: 立场变化量（current - previous）
  usage: 拐点检测的输入；报告中关键变化标注

simulation_result.tick_entries[].entries[].reasoning:
  type: string
  description: Agent 立场变化的推理链
  computation: Phase 3 tick 模拟 LLM 生成
  usage: 调试/排查 agent 行为

simulation_result.tick_entries[].entries[].speaker_status:
  type: string (enum)
  allowed_values:
    - selected: 被选中发言
    - inactive: 沉默（未发言）
  usage: 统计每轮实际发言人数

simulation_result.tick_entries[].entries[].susceptibility:
  type: float  (0.0-1.0)
  description: Agent 的易受影响程度（越高越容易被同化）
  usage: 报告中对极端立场的解释

simulation_result.tick_entries[].entries[].change_reason:
  type: string
  description: 本轮立场变化的归因（如"舆论压力"、"跟随多数"）
  computation: Phase 3 tick 模拟环境
  usage: 报告中对立场变化的具体归因分析

simulation_result.inflection_points[].tick:
  type: int
  description: 拐点发生的轮次
  source: InflectionDetector.detect()
  computation: 基于 stance_delta 和极性统计检测
  usage: 报告中关键转折点标注

simulation_result.inflection_points[].agent_id:
  type: int
  description: 触发拐点的 Agent 编号
  usage: 报告中引用触发者

simulation_result.inflection_points[].group_name:
  type: string
  description: 触发拐点 Agent 所属群体
  usage: 报告中群体层面归因

simulation_result.inflection_points[].description:
  type: string
  description: 拐点的自然语言描述
  usage: 报告中对关键变化的文字说明

simulation_result.risk_verdict.level:
  type: string (enum)
  description: 综合风险等级
  source: RiskAnalyzer.assess_risk()
  computation: 综合 x(t) 趋势、极化指数、立场偏离幅度判定
  allowed_values:
    - low: 低风险，常规关注
    - medium: 中风险，需加强监测
    - high: 高风险，建议主动应对
    - critical: 极高风险，建议立即介入
  usage: 报告关键结论；告警阈值；是否需要人工介入的判断依据

simulation_result.risk_verdict.label:
  type: string
  description: 风险等级的可读标签
  source: RISK_LEVEL_LABELS 映射
  usage: 报告中直接展示

simulation_result.risk_verdict.basis_text:
  type: string
  description: 风险判定的依据文本
  source: RiskAnalyzer.assess_risk()
  computation: 基于各信号指标说明判定理由
  usage: 报告中风险分析章节的依据

simulation_result.risk_verdict.signals.*:
  type: float
  description: 各风险信号指标值（具体信号由 RiskAnalyzer.compute_signals 动态生成）
  source: RiskAnalyzer.compute_signals()
  usage: 细化风险分析

simulation_result.risk_type_classification.primary_types[]:
  type: string[]
  description: 主要风险类型
  source: RiskAnalyzer.classify_risk_types()
  allowed_values:
    - negative_narrative_risk: 负面叙事风险（舆论一致性负面倾向）
  usage: 报告风险分类

simulation_result.risk_type_classification.type_labels[]:
  type: string[]
  description: 风险类型的可读标签
  source: RISK_TYPE_LABELS 映射
  usage: 报告中风险类型展示

simulation_result.agent_stance_matrix[].agent_id:
  type: int
  description: Agent 编号
  source: StanceAnalyzer.build_agent_stance_matrix()
  usage: 报告中立场变化表

simulation_result.agent_stance_matrix[].group_name:
  type: string
  description: 群体名称
  usage: 报告中群体立场分类

simulation_result.agent_stance_matrix[].initial_stance:
  type: float  (0.0-10.0)
  description: Agent 的初始立场值（tick 0）
  usage: 报告中立场的起点

simulation_result.agent_stance_matrix[].final_stance:
  type: float  (0.0-10.0)
  description: Agent 的最终立场值（最后一轮）
  usage: 报告中立场的终点

# ── 辅助信息 ───────────────────────────────────────────────────
source_artifact_refs.tick_logs:
  type: string
  description: tick_logs.json 的相对路径引用
  usage: 调试/定位原始数据

source_artifact_refs.entities_and_relations:
  type: string
  description: entities_and_relations.json 的相对路径引用
  usage: 调试/定位原始数据

source_artifact_refs.social_graph:
  type: string
  description: social_graph.json 的相对路径引用
  usage: 调试/定位原始数据

known_limitations[]:
  type: string[]
  description: 已知局限/免责声明
  usage: 报告中注明模拟局限性
