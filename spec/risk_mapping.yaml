# Adarian 舆情风险映射表 v1.0
#
# 唯一维护入口。所有变更只改此文件：
#   - 新增一级域 → 在 domains 下追加
#   - 新增二级类型 → 在对应 domain 的 types 下追加
#   - 删除类型 → 标记 deprecated
#
# 代码生成：由 tools/dump_risk_mapping.py 自动转译为
#   RISK_TYPE_LABELS、TYPE_TO_DOMAIN_MAP、RiskDomain enum

# 一级风险域（稳定索引层）
domains:
  - id: governance_trust
    label: 治理信任类
    description: 公众将事件解释为监管、执法、处置、政策或问责问题，进而影响对公共机构的信任
    boundary: 不包括纯企业品牌声誉、普通商业口碑

  - id: public_safety_livelihood
    label: 公共安全与民生类
    description: 事件涉及生命健康、公共安全、校园、未成年人、弱势群体、基本民生、公共卫生或生态环境
    boundary: 不包括单纯消费偏好、娱乐争议

  - id: communication_evolution
    label: 传播演化类
    description: 舆论在模拟传播中出现负向叙事聚合、极化、外溢、谣言与事实混淆
    boundary: 不直接判断责任，只描述传播结构变化

  - id: information_security_ideology
    label: 信息安全与意识形态类
    description: 涉及 AI/深度伪造、数据网络安全、科技伦理、价值观对冲、文化安全、国家形象、涉外叙事等
    boundary: 不把一般观点分歧扩大为意识形态风险

  - id: governance_pressure
    label: 治理执行压力类
    description: 事件给基层、跨部门、平台治理、公共服务响应等执行环节带来压力
    boundary: 不包括责任主体清晰的普通企业内部纠纷

  - id: economic_financial
    label: 经济金融类
    description: 涉及金融市场波动、地方债务、就业危机、企业风险、经济政策争议等可能引发系统性经济治理压力的事件
    boundary: 不包括单纯的企业内部管理纠纷、行业常规竞争

